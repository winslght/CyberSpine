name: CyberSpine CI

on:
  push:
    branches: [ "main", "develop" ]
  pull_request:
    branches: [ "main", "develop" ]

jobs:
  test-windows:
    name: Windows CI / Python ${{ matrix.python-version }}
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
        cache: "pip"

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e .[dev]

    - name: Run Full Core Test Suite
      run: |
        python -m unittest tests/test_component_1_io.py tests/test_actuators_safety.py tests/test_aida64_perceptor.py tests/test_app_bridge.py tests/test_local_model_engine.py tests/test_mcp_server.py tests/test_mcp_stdio_stream.py tests/test_new_somatic_perceptors.py tests/test_real_pacemaker.py tests/test_somatic_hub_integration.py tests/test_telemetry_logger.py
